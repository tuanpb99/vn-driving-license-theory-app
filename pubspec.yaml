name: vn_driving_license_theory_app
description: Offline-first Flutter app for Vietnam driving theory exam practice.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  isar: ^3.1.0+1
  path_provider: ^2.1.4
  http: ^1.2.2
  intl: ^0.20.2
  flutter_local_notifications: ^17.2.2
  google_mobile_ads: ^5.2.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/images/
